name: Analyze official Termux APK with REA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/nthn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify exact official APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target results
          gh release download v0.119.0-beta.3 --repo termux/termux-app --pattern 'termux-app_v0.119.0-beta.3+apt-android-7-github-debug_arm64-v8a.apk' --dir target
          printf '%s  %s\n' '3bb969df2400d884ccb929b7d79cc76861f291c98942c401e12408d734a460f3' 'target/termux-app_v0.119.0-beta.3+apt-android-7-github-debug_arm64-v8a.apk' | sha256sum -c -
      - name: Install pinned REA and JADX engine
        run: |
          npm install --no-save --omit=optional rea-agents@6.8.0
          curl -fL --retry 3 -o target/jadx-headless-mcp-0.7.1-all.jar 'https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar'
          printf '%s  %s\n' '6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75' 'target/jadx-headless-mcp-0.7.1-all.jar' | sha256sum -c -
      - name: Analyze APK
        env:
          REA_JADX_MCP_JAR: ${{ github.workspace }}/apps/nthn/target/jadx-headless-mcp-0.7.1-all.jar
        run: |
          set +e
          node_modules/.bin/rea inspect-android-package target/termux-app_v0.119.0-beta.3+apt-android-7-github-debug_arm64-v8a.apk --json > results/package.json 2> results/error.log
          result=$?
          printf '%s\n' "$result" > results/exit-code.txt
          exit "$result"
      - name: Decompile selected Termux methods
        env:
          REA_JADX_MCP_JAR: ${{ github.workspace }}/apps/nthn/target/jadx-headless-mcp-0.7.1-all.jar
        run: |
          apk=target/termux-app_v0.119.0-beta.3+apt-android-7-github-debug_arm64-v8a.apk
          node_modules/.bin/rea inspect-android-method "$apk" com.termux.app.RunCommandService onStartCommand --json > results/run-command-method.json
          node_modules/.bin/rea inspect-android-method "$apk" com.termux.app.TermuxService actionServiceExecute --json > results/service-execute-method.json
          node_modules/.bin/rea inspect-android-method "$apk" com.termux.terminal.TerminalSession initializeEmulator --json > results/terminal-start-method.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-termux-results
          path: apps/nthn/results/
          retention-days: 7
