<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NTHN</title>
<style>
:root{--bg:#07080b;--tx:#e8eaf0;--mu:#6c7384;--ln:rgba(255,255,255,.09);--a:#5ef0ff;--on:#041014;--er:#ff6b81;--ok:#5effb0;--gl:.11}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#f6f7f9;--tx:#0d1117;--mu:#6b7280;--ln:rgba(0,0,0,.1);--a:#0a66ff;--on:#fff;--er:#d92d4b;--ok:#0a9e62;--gl:.08}}
:root[data-theme=light]{--bg:#f6f7f9;--tx:#0d1117;--mu:#6b7280;--ln:rgba(0,0,0,.1);--a:#0a66ff;--on:#fff;--er:#d92d4b;--ok:#0a9e62;--gl:.08}
:root[data-theme=dark]{--bg:#07080b;--tx:#e8eaf0;--mu:#6c7384;--ln:rgba(255,255,255,.09);--a:#5ef0ff;--on:#041014;--er:#ff6b81;--ok:#5effb0;--gl:.11}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,sans-serif;font-weight:300;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mono,button,input,textarea,select{font-family:ui-monospace,Menlo,Consolas,monospace}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 22%,color-mix(in srgb,var(--a) calc(var(--gl)*100%),transparent),transparent 55%);animation:br 7s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.25);opacity:.6}}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:-1;background:linear-gradient(90deg,transparent,var(--a),transparent);opacity:.22;animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(100vh)}}
main{flex:1;min-height:0;position:relative}
.v{position:absolute;inset:0;padding:22px 22px 14px;overflow-y:auto;display:none;flex-direction:column;gap:22px}
.v.on{display:flex;animation:vin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateX(calc(var(--d,1)*28px))}}
.st>*{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) calc(var(--i,0)*80ms + 80ms) forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cap{font-size:10px;letter-spacing:.3em;color:var(--mu);text-transform:uppercase}
.logo{font-size:26px;letter-spacing:.5em;font-weight:300;text-indent:.5em}
.hero0{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px;text-align:center}
.say{font-size:12px;color:var(--mu);min-height:20px;max-width:100%;padding-left:10px;border-left:1px solid var(--a);text-align:left}
.say::after{content:"";display:inline-block;width:5px;height:11px;margin-left:3px;background:var(--a);vertical-align:-1px;animation:bl .6s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hero0 .say{border:0;padding:0;text-align:center}
.met{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);font-size:13px;position:relative}
.k{font-size:10px;letter-spacing:.28em;color:var(--mu)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:9px;position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 1.8s infinite}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
.bar2{position:absolute;left:0;bottom:-1px;height:1px;background:var(--a);box-shadow:0 0 8px var(--a);animation:gr 1.4s cubic-bezier(.2,.8,.2,1) .4s backwards;width:var(--w)}
@keyframes gr{from{width:0}}
#spark{width:90px;height:20px;overflow:visible}
#spark polyline{fill:none;stroke:var(--a);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--a))}
.lk{display:flex;justify-content:space-between;align-items:center;padding:17px 0;cursor:pointer;font-size:12px;letter-spacing:.3em;position:relative;overflow:hidden}
.lk::before,.lk::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%}
.lk::before{background:var(--ln)}.lk::after{background:var(--a);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.lk:hover::after,.lk:active::after{transform:none}
.lk span{transition:transform .35s cubic-bezier(.3,1.6,.5,1);color:var(--a)}
.lk:hover span,.lk:active span{transform:translateX(8px)}
.rip{position:absolute;border-radius:50%;background:var(--a);opacity:.2;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.p .rip{background:var(--on)}
@keyframes rp{to{transform:scale(1);opacity:0}}
.btn{position:relative;overflow:hidden;font-size:11px;letter-spacing:.25em;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:99px;padding:12px 20px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .3s,box-shadow .3s}
.btn:hover{border-color:var(--a)}
.btn:active{transform:scale(.94)}
.btn.p{background:var(--a);color:var(--on);border-color:var(--a);font-weight:600}
.btn.p:hover{box-shadow:0 0 22px color-mix(in srgb,var(--a) 50%,transparent)}
.btn.d{color:var(--er)}.btn.d:hover{border-color:var(--er)}
.btn[disabled]{opacity:.35;pointer-events:none}
.fld{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln);background:linear-gradient(var(--a),var(--a)) 0 100%/0 1px no-repeat;transition:background-size .5s cubic-bezier(.2,.8,.2,1)}
.fld:focus-within{background-size:100% 1px}
.fld input,.fld textarea,.fld select{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font-size:14px;padding:8px 0}
.fld select option{background:var(--bg);color:var(--tx)}
.pr{color:var(--a)}
.go{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--a);cursor:pointer;font-size:15px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .3s}
.go:active{transform:scale(.88)}.go:hover{border-color:var(--a)}
.fill{flex:1;min-height:0}
#tout{overflow-y:auto;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
#tout::after{content:"";display:inline-block;width:7px;height:13px;background:var(--a);vertical-align:-2px;animation:bl .6s steps(1) infinite}
#msgs{display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.m{max-width:88%;animation:up .5s cubic-bezier(.2,.8,.2,1) both;white-space:pre-wrap;font-size:14.5px}
.m.u{align-self:flex-end;text-align:right;color:var(--mu);padding-right:12px;border-right:1px solid var(--a)}
.wave{display:inline-flex;gap:4px;align-items:center;height:18px}
.wave i{width:2px;height:100%;background:var(--a);border-radius:2px;animation:wv 1s ease-in-out infinite;box-shadow:0 0 6px var(--a)}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.row{display:flex;align-items:center;gap:6px}
.f{display:flex;align-items:center;gap:6px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer;position:relative;overflow:hidden;animation:up .55s cubic-bezier(.2,.8,.2,1) both;transition:padding-left .35s cubic-bezier(.3,1.6,.5,1)}
.f:hover{padding-left:8px}
.f span{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f a{font-size:10px;letter-spacing:.15em;padding:8px;color:var(--mu);transition:color .25s}
.f a:hover{color:var(--a)}.f a.x:hover{color:var(--er)}
.tg{position:relative;display:flex;border-bottom:1px solid var(--ln)}
.tg i{position:absolute;left:0;bottom:-1px;height:1px;width:50%;background:var(--a);box-shadow:0 0 10px var(--a);transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.tg button{flex:1;background:none;border:0;padding:14px;font-size:11px;letter-spacing:.3em;color:var(--mu);cursor:pointer;transition:color .3s}
.tg button.on{color:var(--a)}
.sw{width:42px;height:22px;border-radius:11px;border:1px solid var(--ln);position:relative;cursor:pointer;transition:border-color .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:transform .45s cubic-bezier(.3,1.6,.5,1),background .3s,box-shadow .3s}
.sw.on{border-color:var(--a)}.sw.on::after{transform:translateX(20px);background:var(--a);box-shadow:0 0 10px var(--a)}
.nav{display:flex;position:relative;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--ln);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.nav::before{content:"";position:absolute;top:-1px;left:0;width:20%;height:1px;background:linear-gradient(90deg,transparent 30%,var(--a) 30% 70%,transparent 70%);box-shadow:0 0 12px var(--a);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.nav button{flex:1;background:none;border:0;color:var(--mu);padding:13px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .3s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.nav button:active{transform:scale(.88)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.nav span{font-size:8.5px;letter-spacing:.22em;max-height:0;opacity:0;overflow:hidden;transition:max-height .35s,opacity .35s}
.nav .on{color:var(--a)}.nav .on svg{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 5px var(--a))}.nav .on span{max-height:12px;opacity:1}
dialog{border:0;border-top:1px solid var(--a);border-radius:20px 20px 0 0;background:var(--bg);color:var(--tx);padding:22px;width:min(100vw,460px);margin:auto auto 0;animation:sh .4s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px);animation:fi .3s}
@keyframes sh{from{transform:translateY(60px);opacity:0}}@keyframes fi{from{opacity:0}}
dialog form{display:flex;flex-direction:column;gap:18px}
dialog textarea{min-height:200px;resize:none}
.end{display:flex;gap:10px}.end .btn{flex:1}
/* avatar */
.av{width:56px;height:56px;flex:none;cursor:pointer;position:relative;touch-action:manipulation;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--a) 40%,transparent))}
.av.big{width:132px;height:132px;animation:gw 4s ease-in-out infinite}
@keyframes gw{50%{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--a) 65%,transparent))}}
.av svg{width:100%;height:100%;overflow:visible}
.av .body{transform-origin:60px 60px;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.av .orbit{transform-origin:60px 60px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.av .ring{transform-origin:60px 60px;stroke-dasharray:252;animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:252}}
.av .eye,.av .mouth,.av .rpl{transform-box:fill-box;transform-origin:center}
.av .eye{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av .eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .15s}
.av .mouth{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.av[data-mood=thinking] .orbit{animation-duration:1.2s}
.av[data-mood=thinking] .ring{stroke-dasharray:70 182;animation:spin 1s linear infinite}
.av[data-mood=thinking] .eyes{transform:translate(4px,-5px)}
.av[data-mood=talking] .mouth{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(3.2)}}
.av[data-mood=happy] .body{animation:hop .5s ease-out 2}
@keyframes hop{40%{transform:translateY(-12px) scale(1.06)}}
.av[data-mood=happy] .eye{animation:none;transform:scaleY(.35)}
.av[data-mood=happy] .mouth{transform:scale(1.4,1.8)}
.av[data-mood=sleepy] .eye{animation:none;transform:scaleY(.1)}
.av[data-mood=sleepy] .body{animation-duration:7s}.av[data-mood=sleepy] .orbit{animation-duration:30s}
.av[data-mood=sleepy] .mouth{transform:scaleX(.5)}
.av .rpl{fill:none;stroke:var(--a);stroke-width:1.2;animation:rg .9s ease-out forwards}
@keyframes rg{to{transform:scale(1.9);opacity:0}}
.av.spin .body{animation:flip .9s cubic-bezier(.6,0,.2,1)}
@keyframes flip{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <section class="v on st" id="v0">
    <div class="hero0"><div class="av big" id="avH"></div><div class="logo mono">NTHN</div><div class="say mono" id="sayH"></div></div>
    <div class="st" style="display:flex;flex-direction:column">
      <div class="met"><span class="k mono">STATUS</span><span class="mono"><i class="dot"></i>online</span></div>
      <div class="met"><span class="k mono">DISTRO</span><span class="mono">ubuntu 24.04</span></div>
      <div class="met"><span class="k mono">UPTIME</span><span class="mono" id="up">02:14:09</span></div>
      <div class="met"><span class="k mono">LOAD</span><svg id="spark" viewBox="0 0 90 20"><polyline points=""/></svg></div>
      <div class="met"><span class="k mono">STORAGE</span><span class="mono"><b style="font-weight:400" data-n="3.2">0.0</b> / 12 GB</span><u class="bar2" style="--w:27%"></u></div>
    </div>
    <div class="st" style="display:flex;flex-direction:column">
      <div class="lk mono" data-go="1">TERMINAL<span>→</span></div>
      <div class="lk mono" data-go="2">AI<span>→</span></div>
      <div class="lk mono" data-go="3">FILES<span>→</span></div>
    </div>
  </section>

  <section class="v" id="v1" style="padding-bottom:14px">
    <div class="cap mono">terminal · nthn@linux</div>
    <div id="tout" class="mono fill"></div>
    <div class="row"><div class="fld fill"><span class="mono pr">›</span><input id="tin" class="mono" placeholder="command" autocapitalize="off" autocomplete="off" spellcheck="false"></div><button class="go" id="trun">↵</button></div>
  </section>

  <section class="v" id="v2" style="padding-bottom:14px">
    <div class="row" style="gap:14px"><div class="av" id="avA"></div><div class="say mono" id="sayA" style="flex:1"></div></div>
    <div class="fld"><select id="model" class="mono"><option>anthropic/claude-sonnet</option><option>openai/gpt-4o</option><option>meta/llama-3.1-70b</option></select></div>
    <div id="msgs" class="fill"><div class="m">Ready. Ask anything.</div></div>
    <div class="row"><div class="fld fill"><input id="ain" placeholder="message"></div><button class="go" id="asend">↑</button></div>
  </section>

  <section class="v" id="v3">
    <div class="row" style="justify-content:space-between"><div class="mono" id="crumb" style="color:var(--a);font-size:12px;letter-spacing:.1em"></div><div class="row"><button class="btn" id="nf">+ FILE</button><button class="btn" id="nd">+ DIR</button></div></div>
    <div id="fl"></div>
  </section>

  <section class="v st" id="v4">
    <div><div class="cap mono" style="margin-bottom:6px">Theme</div><div class="tg" id="tg"><i></i><button data-t="light" class="mono">LIGHT</button><button data-t="dark" class="mono on">DARK</button></div></div>
    <div><div class="cap mono" style="margin-bottom:6px">OpenRouter</div><div class="fld"><input type="password" class="mono" placeholder="API key"></div><div class="end" style="margin-top:16px"><button class="btn p">SAVE</button><button class="btn d">REMOVE</button></div></div>
    <div><div class="cap mono" style="margin-bottom:6px">Environment</div><div class="met"><span class="mono" style="font-size:12px;letter-spacing:.2em">START ON LAUNCH</span><div class="sw on" id="sw"></div></div><div style="margin-top:16px"><button class="btn" style="width:100%">RESTART ENVIRONMENT</button></div></div>
  </section>
</main>

<nav class="nav" id="nav">
  <button class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span class="mono">HOME</span></button>
  <button><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span class="mono">TERMINAL</span></button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="11" r=".6"/><circle cx="14.5" cy="11" r=".6"/><path d="M9.5 15h5"/></svg><span class="mono">AI</span></button>
  <button><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg><span class="mono">FILES</span></button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span class="mono">SETTINGS</span></button>
</nav>
<dialog id="dlg"><form method="dialog" id="df"></form></dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$$('.st').forEach(s=>[...s.children].forEach((c,i)=>c.style.setProperty('--i',i)));
/* navigation with direction */
let cur=0;
function go(i){const v=$$('.v');v[i].style.setProperty('--d',i>cur?1:-1);cur=i;v.forEach((x,n)=>x.classList.toggle('on',n==i));$$('#nav button').forEach((b,n)=>b.classList.toggle('on',n==i));$('#nav').style.setProperty('--i',i);if(i==0)count()}
$$('#nav button').forEach((b,i)=>b.onclick=()=>go(i));$$('[data-go]').forEach(t=>t.onclick=()=>go(+t.dataset.go));
/* ripple */
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.btn,.lk,.f');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=E('span','rip');s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.append(s);setTimeout(()=>s.remove(),620)});
/* count-up */
function count(){$$('[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=(n*e).toFixed(1);if(p<1)requestAnimationFrame(f)})(t0)})}
count();
/* uptime + load sparkline */
let s=8049;setInterval(()=>{s++;$('#up').textContent=[s/3600|0,s/60%60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')},1000);
const pts=Array.from({length:30},()=>10);
setInterval(()=>{const l=pts[pts.length-1];pts.push(Math.max(2,Math.min(18,l+(Math.random()-.5)*7)));pts.shift();$('#spark polyline').setAttribute('points',pts.map((y,i)=>`${i*3.1},${y}`).join(' '))},400);
/* theme with circular reveal */
function theme(t,ev){const apply=()=>{document.documentElement.dataset.theme=t;$$('#tg button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#tg i').style.transform=t=='dark'?'translateX(100%)':'none'};
 if(!ev||!document.startViewTransition){apply();return}
 try{const x=ev.clientX,y=ev.clientY,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}))}catch(e){apply()}}
$$('#tg button').forEach(b=>b.onclick=e=>theme(b.dataset.t,e));
theme(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
$('#sw').onclick=e=>e.currentTarget.classList.toggle('on');
/* terminal (simulated) */
const out=$('#tout');let typing=false;
const type=async t=>{typing=true;for(const ch of t){out.textContent+=ch;out.scrollTop=out.scrollHeight;await sleep(ch=='\n'?25:8)}typing=false};
type('NTHN shell, visual preview\n$ ');
const sim={help:'commands: help ls whoami uname date clear\n',ls:'bin  etc  home  projects  notes.txt\n',whoami:'nthn\n',uname:'Linux nthn 6.1 aarch64\n',date:()=>new Date().toString()+'\n'};
async function run(){if(typing)return;const i=$('#tin'),c=i.value.trim();i.value='';
 if(c=='clear'){out.textContent='$ ';return}
 const r=sim[c];if(c&&!r){mood('happy',0);say('unknown command');setTimeout(()=>mood('idle'),900)}
 await type(c+'\n'+(c?(r?(typeof r=='function'?r():r):`${c}: command not found\n`):'')+'$ ')}
$('#trun').onclick=run;$('#tin').onkeydown=e=>e.key=='Enter'&&run();
/* ai (simulated, streamed) */
const replies=['This is a visual preview. Real replies appear once the backend is connected.','Mock response from the selected model.','Preview only: no inference is running.'];
function add(t,c){const m=E('div','m '+(c||''),t);$('#msgs').append(m);m.scrollIntoView({block:'end'});return m}
async function send(){const i=$('#ain'),t=i.value.trim();if(!t)return;i.value='';add(t,'u');const w=add('','');w.innerHTML='<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>';
 mood('thinking');say('thinking');await sleep(1400);const r=replies[Math.random()*3|0];mood('talking');say(r.length>60?r.slice(0,57)+'…':r);
 w.textContent='';for(const word of r.split(' ')){w.textContent+=(w.textContent?' ':'')+word;w.scrollIntoView({block:'end'});await sleep(70)}
 mood('idle');rest()}
$('#asend').onclick=send;$('#ain').onkeydown=e=>e.key=='Enter'&&send();
/* files (simulated, in memory) */
const fs={'/':{'projects':{'readme.md':'# NTHN'},'notes.txt':'hello','todo.md':'- ship UI'}};let cwd=[];
const dir=()=>cwd.reduce((n,k)=>n[k],fs['/']);
function ask(title,val,area,ok,danger){return new Promise(res=>{const f=$('#df');f.innerHTML='';f.append(E('div','cap mono',title));let inp=null;
 if(val!==null){const w=E('div','fld');inp=E(area?'textarea':'input','mono');inp.value=val;w.append(inp);f.append(w)}
 const e=E('div','end'),c=E('button','btn','CANCEL'),o=E('button','btn '+(danger?'d':'p'),ok);c.type=o.type='button';e.append(c,o);f.append(e);
 const d=$('#dlg');c.onclick=()=>{d.close();res(null)};o.onclick=()=>{d.close();res(inp?inp.value:true)};d.showModal();inp&&inp.focus()})}
function draw(){$('#crumb').textContent='nthn/'+cwd.join('/');
 const l=$('#fl');l.innerHTML='';const d=dir();let n0=0;
 const row=(txt,fn,color)=>{const r=E('div','f');r.style.animationDelay=(n0++)*55+'ms';const sp=E('span','mono',txt);if(color)sp.style.color=color;r.append(sp);r.onclick=fn;l.append(r);return r};
 if(cwd.length)row('‹ ..',()=>{cwd.pop();draw()},'var(--mu)');
 Object.keys(d).sort((a,b)=>(typeof d[b]=='object')-(typeof d[a]=='object')||a.localeCompare(b)).forEach(n=>{
  const isD=typeof d[n]=='object';
  const r=row((isD?'▸ ':'· ')+n,async()=>{if(isD){cwd.push(n);draw()}else{const v=await ask(n,d[n],true,'SAVE');if(v!==null)d[n]=v}},isD?'var(--a)':null);
  const rn=E('a','mono','REN'),dl=E('a','mono x','DEL');r.append(rn,dl);
  rn.onclick=async e=>{e.stopPropagation();const v=await ask('RENAME',n,false,'RENAME');if(v&&v!=n&&!/\//.test(v)){d[v]=d[n];delete d[n];draw()}};
  dl.onclick=async e=>{e.stopPropagation();if(await ask('DELETE '+n+'?',null,false,'DELETE',true)){r.style.transition='transform .35s,opacity .35s';r.style.transform='translateX(40px)';r.style.opacity=0;await sleep(330);delete d[n];draw()}}});
 if(!Object.keys(d).length)l.append(E('div','cap mono','empty'))}
async function mk(isD){const v=await ask(isD?'NEW FOLDER':'NEW FILE','',false,'CREATE');if(v&&!/\//.test(v)){dir()[v]=isD?{}:'';draw()}}
$('#nf').onclick=()=>mk(false);$('#nd').onclick=()=>mk(true);draw();
/* agent avatar */
const NS='http://www.w3.org/2000/svg';
const svgA=`<svg viewBox="0 0 120 120"><g class="orbit"><circle cx="60" cy="60" r="56" fill="none" stroke="var(--ln)"/><circle cx="60" cy="4" r="2.6" fill="var(--a)"/></g><g class="body"><circle class="ring" cx="60" cy="60" r="40" fill="none" stroke="var(--a)" stroke-width="1.5" stroke-linecap="round"/><g class="eyes"><ellipse class="eye" cx="48" cy="55" rx="3.2" ry="5.2" fill="var(--a)"/><ellipse class="eye" cx="72" cy="55" rx="3.2" ry="5.2" fill="var(--a)"/></g><rect class="mouth" x="52" y="73" width="16" height="2.4" rx="1.2" fill="var(--a)"/></g></svg>`;
const AVS=[['#avH','#sayH'],['#avA','#sayA']].map(([a,s])=>{const o={a:$(a),s:$(s)};o.a.innerHTML=svgA;o.a.dataset.mood='idle';return o});
let moodT,sleepT,taps=[],tid=0;
const quips=['hello, i am nthn','systems nominal','ask me anything','that tickles','need a shell?','watching you'];
async function say(t){const id=++tid;for(let i=1;i<=t.length;i++){if(id!=tid)return;AVS.forEach(o=>o.s.textContent=t.slice(0,i));await sleep(20)}}
function rest(){clearTimeout(sleepT);sleepT=setTimeout(()=>{AVS.forEach(o=>o.a.dataset.mood='sleepy');say('zzz')},30000)}
function mood(m,ms){AVS.forEach(o=>o.a.dataset.mood=m);clearTimeout(moodT);if(ms)moodT=setTimeout(()=>AVS.forEach(o=>o.a.dataset.mood='idle'),ms)}
function pulse(a){const c=document.createElementNS(NS,'circle');c.setAttribute('class','rpl');c.setAttribute('cx',60);c.setAttribute('cy',60);c.setAttribute('r',40);a.querySelector('svg').prepend(c);setTimeout(()=>c.remove(),900)}
AVS.forEach(o=>o.a.onclick=()=>{const t=Date.now();taps=taps.filter(x=>t-x<1500);taps.push(t);pulse(o.a);
 if(taps.length>=3){taps=[];AVS.forEach(p=>{p.a.classList.remove('spin');p.a.offsetWidth;p.a.classList.add('spin')});say('wheee')}
 else{mood('happy',1100);say(quips[Math.random()*quips.length|0])}});
const look=e=>AVS.forEach(o=>{const r=o.a.getBoundingClientRect();if(!r.width)return;const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.min(1,Math.hypot(dx,dy)/220),a=Math.atan2(dy,dx);o.a.style.setProperty('--ex',Math.cos(a)*d*5+'px');o.a.style.setProperty('--ey',Math.sin(a)*d*4+'px')});
addEventListener('pointermove',look);
addEventListener('pointerdown',e=>{look(e);if(AVS[0].a.dataset.mood=='sleepy'){mood('idle');say('back online')}rest()});
say('hello, i am your agent');rest();
</script>
